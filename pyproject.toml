[project]
name = "vetlog-buddy"
version = "1.5.6"
description = "MySQL database analyzer for Vetlog"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache 2.0" }
authors = [{ name = "Jose Morales", email = "contact@josdem.io" }]
dependencies = [
  "coverage>=7.14.1",
  "mysql-connector-python>=9.7.0",
  "pydantic-settings>=2.14.1",
  "pymysql>=1.2.0",
  "python-dotenv>=1.2.2",
  "sqlalchemy>=2.0.50",
  "sqlmodel>=0.0.38",
  "testcontainers>=4.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.15",
  "pytest-cov>=7.1.0",
]

[project.scripts]
list_suspicious = "vetlog_buddy.main:list_suspicious_users"
remove_invalid = "vetlog_buddy.main:remove_invalid_users"
vaccines = "vetlog_buddy.main:vaccinations_cli"
dewormings = "vetlog_buddy.main:dewormings"
version = "vetlog_buddy.main:version_check"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
